version: 2

# ---------------------------------------------------------------------------
# POINT ZÉRO
#
# Modèle sémantique écrit comme on l'écrit normalement : descriptions courtes,
# labels présents, conventions métier implémentées dans le SQL mais non
# formulées. Il fonctionne. Il alimente des rapports mensuels sans poser de
# problème, parce que l'utilisateur choisit sa métrique dans une liste et sait
# de quoi il parle.
#
# C'est cette version qui sert de point de départ à l'article. Elle n'est pas
# à corriger avant les tests.
# ---------------------------------------------------------------------------

models:
  - name: fct_factures
    semantic_model:
      enabled: true
      name: fct_factures
    description: Factures émises aux clients.
    agg_time_dimension: date_facturation
    columns:
      - name: invoice_id
        entity:
          type: primary
          name: facture
      - name: contract_id
        entity:
          type: foreign
          name: contrat
      - name: period_start
        dimension:
          type: time
          name: date_facturation
        granularity: day
      - name: issue_date
        dimension:
          type: time
          name: date_emission
        granularity: day
      - name: invoice_type
        dimension:
          type: categorical
          name: type_facture
      - name: offer_code
        dimension:
          type: categorical
          name: offre
      - name: region
        dimension:
          type: categorical
    metrics:
      - name: revenue_gross
        label: Chiffre d'affaires brut
        description: Chiffre d'affaires hors taxes.
        type: simple
        agg: sum
        expr: case when invoice_type = 'AVOIR' then 0 else amount_ht end
      - name: revenue_net
        label: Chiffre d'affaires net
        description: Chiffre d'affaires hors taxes, après avoirs.
        type: simple
        filter: |
          {{ Dimension('contrat__is_internal') }} = false

        agg: sum
        expr: amount_ht
  - name: fct_releves
    semantic_model:
      enabled: true
      name: fct_releves
    description: Relevés de consommation.
    agg_time_dimension: date_releve
    columns:
      - name: reading_id
        entity:
          type: primary
          name: releve
      - name: contract_id
        entity:
          type: foreign
          name: contrat
      - name: reading_date
        dimension:
          type: time
          name: date_releve
        granularity: day
      - name: reading_type
        dimension:
          type: categorical
          name: type_releve
      - name: offer_code
        dimension:
          type: categorical
          name: offre
      - name: region
        dimension:
          type: categorical
    metrics:
      - name: consumption_kwh
        label: Consommation
        description: Consommation en kWh.
        type: simple
        agg: sum
        expr: kwh
  - name: dim_contrats
    semantic_model:
      enabled: true
      name: dim_contrats
    description: Contrats clients.
    agg_time_dimension: date_debut
    columns:
      - name: contract_id
        entity:
          type: primary
          name: contrat
      - name: start_date
        dimension:
          type: time
          name: date_debut
        granularity: day
      - name: offer_code
        dimension:
          type: categorical
          name: offre
      - name: region
        dimension:
          type: categorical
    metrics:
      - name: active_contracts
        label: Contrats actifs
        description: Nombre de contrats actifs.
        type: simple
        agg: count_distinct
        expr: contract_id